name: Build QUICKFIX iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Firebase Config Exists
        run: |
          if [ ! -f ios/GoogleService-Info.plist ] && [ ! -f ios/QUICKFIX/GoogleService-Info.plist ]; then
            echo "Creating temporary GoogleService-Info.plist for build..."
            mkdir -p ios/QUICKFIX
            cat << 'EOF' > ios/QUICKFIX/GoogleService-Info.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>API_KEY</key>
              <string>AIzaSyDummyKey</string>
              <key>GCM_SENDER_ID</key>
              <string>123456789</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.quickfix</string>
              <key>PROJECT_ID</key>
              <string>quickfix-dummy</string>
              <key>GOOGLE_APP_ID</key>
              <string>1:123456789:ios:dummy</string>
            </dict>
            </plist>
            EOF
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Build iOS Archive
        run: |
          cd ios
          export NODE_BINARY=$(which node)
          xcodebuild -workspace QUICKFIX.xcworkspace \
            -scheme QUICKFIX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_BUILD_SETTINGS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean archive -archivePath build/QUICKFIX.xcarchive

      - name: Package .app into .ipa
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/QUICKFIX.xcarchive/Products/Applications/QUICKFIX.app build/Payload/
          cd build
          zip -r QUICKFIX.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUICKFIX-iOS-IPA
          path: ios/build/QUICKFIX.ipa