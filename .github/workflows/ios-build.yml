name: Build QUICKFIX iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Firebase Config Exists
        run: |
          mkdir -p ios/QUICKFIX
          if [ ! -f ios/GoogleService-Info.plist ] && [ ! -f ios/QUICKFIX/GoogleService-Info.plist ]; then
            echo "Creating dummy GoogleService-Info.plist..."
            echo '<?xml version="1.0" encoding="UTF-8"?>' > ios/QUICKFIX/GoogleService-Info.plist
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '<plist version="1.0"><dict>' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '<key>API_KEY</key><string>AIzaSyDummyKey</string>' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '<key>GCM_SENDER_ID</key><string>123456789</string>' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '<key>PLIST_VERSION</key><string>1</string>' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '<key>BUNDLE_ID</key><string>com.quickfix</string>' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '<key>PROJECT_ID</key><string>quickfix-dummy</string>' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '<key>GOOGLE_APP_ID</key><string>1:123456789:ios:dummy</string>' >> ios/QUICKFIX/GoogleService-Info.plist
            echo '</dict></plist>' >> ios/QUICKFIX/GoogleService-Info.plist
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Patch Pods Deployment Target (Fix gRPC-C++)
        run: |
          cd ios
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
            end
          end
          project.save
          "

      - name: Generate React Native JS Bundle
        run: |
          mkdir -p ios/QUICKFIX
          npx react-native bundle \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/ || true

      - name: Build iOS Workspace (.app)
        run: |
          cd ios
          export NODE_BINARY=$(which node)
          xcodebuild -workspace QUICKFIX.xcworkspace \
            -scheme QUICKFIX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_BUILD_SETTINGS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package .app into .ipa
        run: |
          cd ios
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/QUICKFIX.app build/Payload/
          cd build
          zip -r QUICKFIX.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUICKFIX-iOS-IPA
          path: ios/build/QUICKFIX.ipa