name: Build QUICKFIX iOS (.ipa)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Create Firebase Plist Files
        run: |
          mkdir -p ios/QUICKFIX
          cat << 'EOF' > ios/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>AIzaSyDummyKey</string>
            <key>GCM_SENDER_ID</key><string>123456789</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.quickfix</string>
            <key>PROJECT_ID</key><string>quickfix-dummy</string>
            <key>GOOGLE_APP_ID</key><string>1:123456789:ios:dummy</string>
          </dict>
          </plist>
          EOF
          cp ios/GoogleService-Info.plist ios/QUICKFIX/GoogleService-Info.plist

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || pod install

      - name: Patch Pods Deployment Target & Disable Signing
        run: |
          cd ios
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
            end
          end
          project.save
          "

      - name: Generate React Native JS Bundle
        run: |
          mkdir -p ios/QUICKFIX
          npx react-native bundle \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/ || true

      - name: Build iOS App
        run: |
          cd ios
          export NODE_BINARY=$(which node)
          export SKIP_BUNDLING=1
          xcodebuild -workspace QUICKFIX.xcworkspace \
            -scheme QUICKFIX \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_BUILD_SETTINGS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package .app into .ipa
        run: |
          cd ios
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "QUICKFIX.app" | head -n 1)
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r QUICKFIX.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUICKFIX-iOS-IPA
          path: ios/build/QUICKFIX.ipa